<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms</title>
    <link rel="stylesheet" href="/styles/index.css" />
  </head>
  <body>
    <form>
      <fieldset>
        <h2>Ваши личные данные</h2>

        <label for="name">Ваше имя</label>
        <input type="text" id="name" placeholder=" Имя" required />

        <label for="age">Ваш возраст</label>
        <input type="number" id="age" placeholder=" Возраст" required />

        <label for="namber">Ваш номер телефона</label>
        <input type="tel" id="namber" placeholder=" Номер телефона" required />

        <label for="email">Ваша почта</label>
        <input type="email" id="email" placeholder=" Почта" required />

        <label for="">Сообщение</label>
        <textarea
          name=""
          id=""
          placeholder=" Ваше сообщение"
          required
        ></textarea>
        <label class="checkbox"
          ><input class="rulle" type="checkbox" required /> Я принимаю
          правила</label
        >
        <button type="submit">Отправить</button>
      </fieldset>
    </form>
  </body>
</html>
